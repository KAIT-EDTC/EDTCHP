<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <title>商品トップ|神奈川工科大学EDTC</title>
    <meta name="description" content="神奈川工科大学EDTCが開発した教材・製品の一覧ページです。">
    <!-- OGP -->
    <meta property="og:title" content="商品トップ|神奈川工科大学EDTC">
    <meta property="og:description" content="神奈川工科大学EDTCが開発した教材・製品の一覧ページです。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://kaitedtc.com/product-top.html">
    <!-- 画像はあとで変える -->
    <meta property="og:image" content="https://kaitedtc.com/public/img/EDTC-icon.webp">
    <meta property="og:site_name" content="神奈川工科大学EDTC">
    <meta property="og:locale" content="ja_JP">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@kait_edtc">
    <meta name="twitter:title" content="商品トップ|神奈川工科大学EDTC">
    <meta name="twitter:description" content="神奈川工科大学EDTCが開発した教材・製品の一覧ページです。">
    <meta name="twitter:image" content="https://kaitedtc.com/public/img/EDTC-icon.webp">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/product.css">
    <link rel="stylesheet" href="css/headfoot.css">
    <link rel="stylesheet" href="css/global.css">
    <!-- icon link tag -->
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
</head>

<body data-base-path="./">
    <!-- ヘッダー: loadCommon.js により動的挿入 -->
    <div id="common-header"></div>

    <main>
        <!-- ヒーロー -->
        <section class="pdct-hero" aria-label="プロダクトヒーロー">
            <img src="public/img/EDTC-teaching-machine.webp" alt="" class="pdct-hero__bg" width="1280" height="720" fetchpriority="high">
            <div class="pdct-hero__overlay">
                <h1 class="pdct-hero__title">Product</h1>
                <p class="pdct-hero__desc">EDTCが開発した教材・製品をご紹介します。</p>
            </div>
        </section>

        <!-- フィルタ -->
        <section class="pdct-filters" aria-label="プロダクトフィルタ">
            <div class="pdct-filters__row">
                <div class="pdct-filters__age">
                    <label class="pdct-filters__label">対象年齢</label>
                    <div class="pdct-filters__tags" role="group" aria-label="対象年齢フィルタ">
                        <!-- JSで生成 -->
                    </div>
                </div>
            </div>
            <div class="pdct-filters__meta">
                <span class="pdct-filters__count" aria-live="polite"></span>
                <button class="pdct-filters__clear" type="button" hidden>フィルタをクリア</button>
            </div>
        </section>

        <!-- プロダクト一覧 -->
        <nav class="pagination-area pagination-area--top" aria-label="ページネーション（上部）" hidden></nav>
            <div class="pdct-area">
                <!-- JSでカードを生成 -->
            </div>
        <nav class="pdct-nav__dots" role="navigation" aria-label="ページインジケーター"></nav>

        <!-- ページネーション -->
        <nav class="pagination-area pagination-area--bottom" aria-label="ページネーション" hidden></nav>
    </main>

    <!-- フッター: loadCommon.js により動的挿入 -->
    <div id="common-footer"></div>

    <script type="module" src="./script/loadCommon.js"></script>
    <script type="module" src="script/product/productListRenderer.js"></script>
</body>

</html>
