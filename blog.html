<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <title>ブログ|神奈川工科大学EDTC</title>
    <meta name="description" content="神奈川工科大学EDTCのブログ記事一覧。活動報告やイベント情報をお届けします。">
    <!-- OGP -->
    <meta property="og:title" content="ブログ|神奈川工科大学EDTC">
    <meta property="og:description" content="神奈川工科大学EDTCのブログ記事一覧。活動報告やイベント情報をお届けします。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://kaitedtc.com/blog.html">
    <!-- 画像はあとで変える -->
    <meta property="og:image" content="https://kaitedtc.com/public/img/EDTC-icon.webp">
    <meta property="og:site_name" content="神奈川工科大学EDTC">
    <meta property="og:locale" content="ja_JP">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@kait_edtc">
    <meta name="twitter:title" content="ブログ|神奈川工科大学EDTC">
    <meta name="twitter:description" content="神奈川工科大学EDTCのブログ記事一覧。活動報告やイベント情報をお届けします。">
    <meta name="twitter:image" content="https://kaitedtc.com/public/img/EDTC-icon.webp">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/headfoot.css">
    <link rel="stylesheet" href="css/blog.css">
    <!-- icon link tag -->
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180x180.png">

</head>

<body data-base-path="./">
    <!-- ヘッダー: loadCommon.js により動的挿入 -->
    <div id="common-header"></div>
    <main>
        <!-- ヒーロー -->
        <section class="blog-hero" aria-label="ブログヒーロー">
            <img src="public/img/EDTC-GroupPhoto.webp" alt="" class="blog-hero__bg" width="1280" height="720" fetchpriority="high">
            <div class="blog-hero__overlay">
                <h1 class="blog-hero__title">Blog</h1>
                <p class="blog-hero__desc">EDTCの活動や日々の取り組みをお届けします。</p>
            </div>
        </section>

        <!-- フィルタ -->
        <section class="blog-filters" aria-label="記事フィルタ">
            <div class="blog-filters__row">
                <div class="blog-filters__year">
                    <label for="year-select">年で絞り込み</label>
                    <select id="year-select">
                        <option value="">すべての年</option>
                    </select>
                </div>
                <div class="blog-filters__tags" role="group" aria-label="タグフィルタ">
                    <!-- JSで生成 -->
                </div>
            </div>
            <div class="blog-filters__meta">
                <span class="blog-filters__count" aria-live="polite"></span>
                <button class="blog-filters__clear" type="button" hidden>フィルタをクリア</button>
            </div>
        </section>

        <!-- 記事一覧 -->
        <nav class="pagination-area pagination-area--top" aria-label="ページネーション（上部）" hidden></nav>
            <div class="blog-area">
                <script type="module" src="script/blog/articleListRenderer.js"></script>
            </div>
        <nav class="blog-nav__dots" role="navigation" aria-label="ページインジケーター"></nav>

        <!-- ページネーション -->
        <nav class="pagination-area pagination-area--bottom" aria-label="ページネーション" hidden></nav>
    </main>
    <!-- フッター: loadCommon.js により動的挿入 -->
    <div id="common-footer"></div>

    <script type="module" src="./script/loadCommon.js"></script>
</body>

</html>
